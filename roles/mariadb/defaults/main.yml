---
# defaults file for mariuszczyz.mariadb
mariadb_packages:
  - mariadb-server
  - mariadb
  - python3-PyMySQL
mariadb_service_name: mariadb
mariadb_socket: /var/lib/mysql/mysql.sock
mariadb_config_file: /etc/my.cnf.d/server.cnf
mariadb_root_clients:
  - localhost
  - 127.0.0.1
  - ::1
mariadb_port: 3306
mariadb_innodb_file_per_table: true
mariadb_performance_schema: false
mariadb_key_buffer_size: 4M
mariadb_max_allowed_packet: 1M
mariadb_table_open_cache: 16
mariadb_sort_buffer_size: 64K
mariadb_read_buffer_size: 256K
mariadb_read_rnd_buffer_size: 256K
mariadb_net_buffer_length: 2K
mariadb_thread_stack: 256K
mariadb_server_id: 1
mariadb_wait_timeout: 120
mariadb_thread_cache_size: 64
mariadb_bulk_insert_buffer_size: 4M
mariadb_tmp_table_size: 4M
mariadb_max_heap_table_size: 4M
mariadb_myisam_sort_buffer_size: 2M
mariadb_innodb_buffer_pool_size: 128M
mariadb_innodb_log_file_size: 16M
mariadb_innodb_log_buffer_size: 24M
mariadb_innodb_flush_log_at_trx_commit: 1
mariadb_innodb_lock_wait_timeout: 50
